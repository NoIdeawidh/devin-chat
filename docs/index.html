<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Devin-Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-box">
      <h1>Devin-Chat</h1>
      <label for="login-password">Passwort</label>
      <input id="login-password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
      <button type="submit">Anmelden</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
      <button id="new-chat" class="new-chat-btn" type="button">+ Neuer Chat</button>
      <nav id="chat-list" class="chat-list" aria-label="Chats"></nav>
      <div class="sidebar-footer">
        <button id="logout" class="logout-btn" type="button">Abmelden</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Menü">☰</button>
        <h1 id="chat-title" class="chat-title">Neuer Chat</h1>
        <div class="model-selects">
          <select id="family-select" class="model-select" aria-label="Modell-Familie"></select>
          <select id="variant-select" class="model-select" aria-label="Modell-Variante"></select>
        </div>
      </header>
      <div id="offline-banner" class="offline-banner" hidden>
        PC ist offline – Antworten kommen erst, wenn der PC läuft.
      </div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="composer-input" rows="1" placeholder="Nachricht schreiben…" aria-label="Nachricht"></textarea>
        <button id="send-btn" class="send-btn" type="submit" aria-label="Senden">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 20v-6l8-2-8-2V4l19 8-19 8z"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
